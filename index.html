<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>dataterminals</title>
  <meta name="color-scheme" content="dark">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="dataterminals">
  <meta property="og:url" content="https://dataterminals.github.io/">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d8794c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=85ddd5b2">

  <!-- Mount the saved theme before the first paint, so a visitor who chose one
       last time doesn't watch the default palette flash past. Deliberately
       inline and blocking: a separate file would land too late to help.
       theme.js owns everything after this, the background clip included. -->
  <script>
    try {
      var t = localStorage.getItem('dt:theme');
      if (t === 'ember' || t === 'night' || t === 'morning' || t === 'flare' || t === 'stone') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Blurred looping background, one clip per theme (assets/bg*.webm + .mp4,
       with a poster each). theme.js fills in the <source>s for whichever theme
       is mounted — hard-coding one theme's here would make the other download
       both — and fades the video in once it can play. Until then, and for good
       without JS or a playable file, the theme's CSS gradient shows through. -->
  <div class="bg" aria-hidden="true">
    <video class="bg__video" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <div class="bg__scrim" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Background theme switch. Hidden until theme.js mounts it: with the script
       absent there is nothing to switch, so an inert capsule would be a lie. -->
  <div class="theme" hidden>
    <button class="theme__switch" type="button" id="theme-switch">
      <span class="theme__track" aria-hidden="true"><span class="theme__thumb"></span></span>
      <span class="theme__name" aria-hidden="true"></span>
    </button>
  </div>

  <main>
    <div class="screen">
      <header class="hero">
        <h1 class="hero__name reveal" aria-label="dataterminals"><span class="spindle" aria-hidden="true"><span class="spindle__track"><span class="spindle__word">data</span><span class="spindle__word">sylvi</span><span class="spindle__word">deni</span><span class="spindle__word">data</span></span></span><span class="spindle__suffix" aria-hidden="true">terminals</span></h1>
        <p class="hero__tagline" aria-label="In my time…"><span class="tl tl-en" style="left:1%; top:48px; font-size:1.2rem; letter-spacing:.06em; --o:.95; --d:.2s">In my time…</span><span class="tl" aria-hidden="true" style="left:7%; top:6px; font-size:1.05rem; --o:.5; --d:.55s">私の時代に…</span><span class="tl" aria-hidden="true" style="left:68%; top:42px; font-size:1rem; letter-spacing:.03em; --o:.42; --d:.75s">В мое время …</span><span class="tl" aria-hidden="true" style="left:11%; top:86px; font-size:1rem; --o:.5; --d:.95s">在我的时代…</span><span class="tl" aria-hidden="true" style="left:74%; top:4px; font-size:.98rem; letter-spacing:.02em; --o:.4; --d:1.15s">내 시간에…</span><span class="tl" aria-hidden="true" dir="rtl" style="left:73%; top:88px; font-size:.95rem; --o:.4; --d:1.35s">في وقتي…</span><span class="tl" aria-hidden="true" style="left:42%; top:20px; font-size:1rem; letter-spacing:.03em; --o:.47; --d:1.55s">De mon temps…</span><span class="tl" aria-hidden="true" style="left:35%; top:54px; font-size:.98rem; --o:.44; --d:1.75s">मेरे समय में…</span><span class="tl" aria-hidden="true" style="left:39%; top:80px; font-size:.95rem; --o:.42; --d:1.95s">Στον καιρό μου…</span></p>
        <p class="hero__subtag" id="subtag"><!-- one random phrase from subtaglines.json, injected by app.js --></p>
      </header>

      <!-- Each feature's id doubles as its shareable anchor; the .permalink
           handle beside it copies that url (permalinks.js). -->

      <!-- The live beacon block: the repos actually being worked on, above the
           curated grid. Empty and `hidden` here because none of it can be known
           without the GitHub API — app.js fills it and unhides it when the data
           lands, and it stays gone if that never happens, costing no layout
           either way. It sits in the markup rather than being injected whole so
           that its handle exists for permalinks.js, which binds every handle in
           one pass at load and would never see one added later. -->
      <section class="links" id="current" aria-label="Current projects" hidden>
        <p class="links__eyebrow">Currently working on<a class="permalink" href="#current" data-name="Currently working on" aria-label="Copy a link to Currently working on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></p>
        <div class="links__list" id="current-list">
          <!-- the top-scoring repos from the GitHub push feed, injected by app.js -->
        </div>
      </section>

      <section class="links" id="work" aria-label="Selected projects">
        <p class="links__eyebrow">Selected work<a class="permalink" href="#work" data-name="Selected work" aria-label="Copy a link to Selected work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></p>
        <div class="links__list" id="links">
          <!-- rendered from links.json (featured), enriched from the GitHub API -->
        </div>
      </section>

      <!-- Link shelf + Discord card, grouped so main's column gap applies to the
           pair rather than falling between them. -->
      <div class="elsewhere">
        <!-- Floating external-link shelf. Icons drift + glow-flicker (desynced per
             icon via nth-child); shelf.js swaps the native tooltip for a
             cursor-anchored leader-line readout (see the tarot signature diagram).
             The .shelf-bar wrapper exists to give the permalink handle something
             to hang off — the rail itself has no label and no padding band. -->

            </a>
            <a class="shelf__link" href="https://dataterminals.github.io/NewStefanMap/" target="_blank" rel="noopener"
               aria-label="NewStefanMap (opens dataterminals.github.io/NewStefanMap)" data-name="NewStefanMap" data-url="dataterminals.github.io/NewStefanMap">
              <svg class="shelf__icon shelf__icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Zm2.6 7a2.6 2.6 0 1 0-5.2 0 2.6 2.6 0 0 0 5.2 0Z"/></svg>
            </a>
            <a class="shelf__link" href="https://dataterminals.github.io/PolitikoTimeWire/" target="_blank" rel="noopener"
               aria-label="Politiko Time Wire (opens dataterminals.github.io/PolitikoTimeWire)" data-name="Politiko Time Wire" data-url="dataterminals.github.io/PolitikoTimeWire">
              <svg class="shelf__icon shelf__icon--stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.4 12H4.8 M19.2 12H22.6 M3.1 10.3V13.7 M20.9 10.3V13.7 M12 7.4V12H16"/><circle cx="12" cy="12" r="7.2"/></svg>

            <a class="shelf__link" href="https://dataterminals.github.io/t1-crowdfunds/" target="_blank" rel="noopener"

              <svg class="shelf__icon shelf__icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M13.6 2.8C9.2 2 5.4 4.2 3.9 7.4 3.1 9 1.6 10.3 1.5 12.1c-.1 1.3.6 2.2 1.5 2.7v2.6h1v1.5h1v-1.5h1v1.7h1v-1.7h1v1.6h1v-1.6h1v1.3h1v-1.3h1.8V2.8ZM3.6 10.6 7 9.9l.4 2-2.5 1.2-1.5-1.1ZM9.1 5.6h1.3v7H9.1ZM7.2 7.6h5.1v1.2H7.2ZM10.4 12l1.6-1 .6 1-1.6 1Z"/><path d="M14 3.6h3.4v1.5H14ZM17 6.6h4.6v1.5H17ZM14.4 9.6h2.8v1.5h-2.8ZM17.6 12.4h3.8v1.5h-3.8ZM14.8 15.2h2.4v1.5h-2.4Z"/></svg>

        </div>

        <!-- Userscript rack. Rendered from userscripts.json by userscripts.js,
             which keeps the section hidden until real data lands (as the Discord
             card does), so a failed fetch leaves no empty panel rather than an
             empty one. Each tile links at the script's own @downloadURL. -->
        <section class="uscripts" id="userscripts" aria-label="Userscripts" hidden>
          <a class="permalink permalink--corner" href="#userscripts" data-name="Userscripts" aria-label="Copy a link to Userscripts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a>
          <p class="uscripts__eyebrow">Userscripts</p>
          <div class="uscripts__filters" id="us-filters" role="group" aria-label="Filter userscripts by site">
            <!-- one chip per category, rendered by userscripts.js -->
          </div>
          <div class="uscripts__grid" id="us-grid">
            <!-- one tile per script, rendered by userscripts.js -->
          </div>
        </section>

        <!-- Live Discord presence (Lanyard). Stays hidden until the account is
             monitored by Lanyard; see the header of discord.js for the one-time setup. -->
        <section class="presence" id="presence" aria-label="Discord presence">
          <div class="presence__card" id="presence-card">
            <!-- rendered from Lanyard by discord.js -->
          </div>
        </section>
      </div>
    </div>
    <section class="chart" id="natalchart" aria-label="Natal chart">
      <a class="permalink permalink--corner" href="#natalchart" data-name="the natal chart" aria-label="Copy a link to the natal chart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a>
      <div class="chart__wrap" id="natal">
        <!-- wheel + placements rendered by natal.js -->
      </div>
    </section>

    <section class="tarot" id="tarot" aria-label="Tarot">
      <a class="permalink permalink--corner" href="#tarot" data-name="the tarot spread" aria-label="Copy a link to the tarot spread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a>
      <div class="tarot__deck" id="tarot-deck">
        <!-- cards rendered by tarot.js -->
      </div>
    </section>

  </main>
